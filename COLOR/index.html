<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/C.png">
  <title>色一把</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .target-swatch {
      width: 140px;
      height: 140px;
      border-radius: var(--radius-md);
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      margin: 10px 0;
    }
    .players-area {
      display: flex;
      gap: 40px;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    .player-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.02);
      min-width: 280px;
    }
    .player-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .player-name.p1 { color: var(--color-accent); }
    .player-name.p2 { color: var(--color-success); }
    .color-preview {
      width: 100px;
      height: 100px;
      border-radius: var(--radius-md);
      border: 3px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.4);
      transition: background-color 0.03s;
    }
    .picker-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 240px;
    }
    .hue-bar {
      width: 100%;
      height: 18px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      position: relative;
      touch-action: none;
      background: linear-gradient(to right,
        #ff0000 0%, #ffff00 17%, #00ff00 33%,
        #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%);
    }
    .hue-thumb {
      position: absolute;
      top: -4px;
      width: 10px;
      height: 26px;
      border-radius: 5px;
      border: 2px solid #fff;
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
      transform: translateX(-5px);
      pointer-events: none;
    }
    .sv-canvas {
      width: 240px;
      height: 160px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: crosshair;
      position: relative;
      overflow: hidden;
      touch-action: none;
      background: #ff0000;
    }
    .sv-overlay-white {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(255, 255, 255, 1), rgba(255, 255, 255, 0));
    }
    .sv-overlay-black {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 1), rgba(0, 0, 0, 0));
    }
    .sv-thumb {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.6);
      transform: translate(-7px, -7px);
      pointer-events: none;
    }
    .hue-label {
      font-size: 12px;
      color: var(--color-neutral);
      font-family: monospace;
    }
    .compare-area {
      display: flex;
      gap: 30px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin: 12px 0;
    }
    .compare-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .compare-swatch {
      width: 90px;
      height: 90px;
      border-radius: var(--radius-md);
      border: 2px solid rgba(255, 255, 255, 0.25);
    }
    .compare-label {
      font-size: 12px;
      color: var(--color-neutral);
    }
    @media (max-width: 960px) {
      .players-area { gap: 20px; }
    }
    @media (max-width: 640px) {
      .player-panel { min-width: unset; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="title">🌈 色一把</div>
  <div class="subtitle">COLOR MASTER</div>

  <div class="test-area">
    <div id="modeSelect" class="mode-select">
      <button class="btn btn-primary" onclick="startSolo()">🎯 单人模式</button>
      <button class="btn btn-danger"  onclick="showBoSelect()">⚔️ 双人Battle</button>
    </div>

    <div id="boSelect" class="bo-select hidden">
      <span class="bo-label">选择赛制：</span>
      <button class="bo-btn" data-bo="1">BO1</button>
      <button class="bo-btn" data-bo="3">BO3</button>
      <button class="bo-btn" data-bo="5">BO5</button>
      <button class="bo-btn" data-bo="7">BO7</button>
      <button class="bo-btn active" data-bo="-1">♾️无限</button>
      <button class="btn btn-ghost" style="padding:6px 14px;font-size:13px;" onclick="backToModeSelect()">← 返回</button>
    </div>

    <div id="gameContainer" class="game-container hidden">
      <div id="targetLabel"  class="target-label hidden">🌈 目标颜色</div>
      <div id="targetSwatch" class="target-swatch hidden"></div>
      <div id="roundInfo" class="round-info hidden"></div>

      <div id="scoreBoard" class="score-board hidden">
        <div class="score-item">
          <div class="score-name p1-color">玩家1</div>
          <div class="score-value p1-score" id="p1Score">0</div>
        </div>
        <div class="score-divider">:</div>
        <div class="score-item">
          <div class="score-name p2-color">玩家2</div>
          <div class="score-value p2-score" id="p2Score">0</div>
        </div>
      </div>

      <div id="flowTip" class="flow-tip">点击开始按钮进入游戏</div>
      <div id="playersArea" class="players-area hidden"></div>
      <div id="compareArea" class="compare-area hidden"></div>
      <div id="feedbackText" class="feedback-text"></div>
      <div id="progressText" class="progress"></div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
        <button id="btnStart"   class="btn btn-success"  onclick="startRound()">▶ 开始</button>
        <button id="btnConfirm" class="btn btn-primary hidden" onclick="confirmColor()">✓ 确定</button>
        <button id="btnNext"    class="btn btn-warning hidden" onclick="nextRound()">▶ 下一回合</button>
        <button id="btnBack"    class="btn btn-ghost"    onclick="backToModeSelect()">← 返回菜单</button>
      </div>

      <div id="resultContainer" class="result-container hidden"></div>
    </div>

    <div id="ruleTip" class="rule-tip">
      <strong style="color:#ccc;">规则：</strong><br>
      • <strong>单人模式</strong>：系统随机生成目标颜色，用色相条+色板调配出尽可能接近的颜色，点击确定提交<br>
      • <strong>双人Battle</strong>：双方共享同一目标颜色，各自独立调色，偏差更小者赢得该回合<br>
      • <strong>操作</strong>：拖动上方色条选色相，在下方色板中点选饱和度（左右）和明度（上下）<br>
      • 评分基于色彩空间距离（Delta E），误差越小评价越高<br>
      • 评价：ΔE ≤3 <span class="text-skyblue">S+</span> | ≤5 <span class="text-orange">S</span> | ≤8 <span class="text-purple">A</span> | ≤14 <span class="text-blue">B</span> | ≤20 <span class="text-red">C</span> | >20 <span class="text-gray">D</span>
    </div>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalBody"  class="modal-body"></div>
      <button class="btn btn-primary" onclick="closeModal()">了解</button>
    </div>
  </div>

  <script src="../js/color.js"></script>
</body>
</html>
