<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/S.png">
  <title>秒一把</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .target-display {
      font-size: 56px;
      font-weight: 800;
      color: var(--color-warning);
      text-align: center;
      margin: 8px 0;
      letter-spacing: 2px;
      text-shadow: 0 0 20px rgba(255, 218, 70, 0.3);
      font-family: Consolas, monospace;
    }
    .players-area {
      display: flex;
      gap: 40px;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    .player-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.02);
      min-width: 260px;
    }
    .player-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .player-name.p1 { color: var(--color-accent); }
    .player-name.p2 { color: var(--color-success); }
    .player-panel {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor: default;
    }
    .status-dot {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.12s;
      -webkit-tap-highlight-color: transparent;
    }
    .player-panel.pressable { cursor: pointer; border-color: var(--border-medium); }
    .player-panel.pressable:hover  .status-dot { transform: scale(1.05); }
    .player-panel.pressable:active .status-dot { transform: scale(0.94); }
    .status-dot.pressable { animation: dotBreath 1.4s ease-in-out infinite; }
    @keyframes dotBreath {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.005); }
    }
    .player-panel.shake { animation: panelShake 0.28s ease; }
    @keyframes panelShake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .status-dot.pressable { animation: none; }
      .player-panel.pressable:hover .status-dot,
      .player-panel.pressable:active .status-dot { transform: none; }
    }
    .status-dot.idle    { background: rgba(255, 255, 255, 0.06); border: 4px solid var(--border-medium); }
    .status-dot.ready   { background: rgba(255, 218, 70, 0.12); border: 4px solid var(--color-warning); box-shadow: 0 0 40px rgba(255, 218, 70, 0.35); }
    .status-dot.running { background: rgba(63, 136, 253, 0.12); border: 4px solid var(--color-accent);  box-shadow: 0 0 40px rgba(63, 136, 253, 0.35); }
    .status-dot.stopped { background: rgba(0, 255, 136, 0.12);  border: 4px solid var(--color-success);  box-shadow: 0 0 40px rgba(0, 255, 136, 0.35); }
    .dot-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }
    .dot-label .dl-main {
      font-size: 17px;
      color: var(--color-neutral);
      font-weight: 700;
      letter-spacing: 1px;
    }
    .dot-label .dl-sub {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--color-neutral);
      opacity: 0.85;
    }
    .status-dot.ready   .dot-label { color: var(--color-warning); }
    .status-dot.running .dot-label { color: var(--color-accent); }
    .status-dot.stopped .dot-label { color: var(--color-success); }
    .key-hint {
      font-size: 13px;
      color: var(--color-neutral);
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      font-family: monospace;
      letter-spacing: 1px;
    }
    .key-hint kbd {
      display: inline-block;
      padding: 2px 8px;
      margin: 0 3px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid var(--border-medium);
      border-radius: 4px;
      font-weight: 700;
      color: #fff;
      font-size: 12px;
    }
    @media (max-width: 960px) {
      .players-area { gap: 20px; }
    }
    @media (max-width: 640px) {
      .player-panel { min-width: unset; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="title">⏱️ 秒一把</div>
  <div class="subtitle">SECOND MASTER</div>

  <div class="test-area">
    <div id="modeSelect" class="mode-select">
      <button class="btn btn-primary" onclick="startSolo()">🎯 单人模式</button>
      <button class="btn btn-danger"  onclick="showBoSelect()">⚔️ 双人Battle</button>
    </div>

    <div id="boSelect" class="bo-select hidden">
      <span class="bo-label">选择赛制：</span>
      <button class="bo-btn" data-bo="1">BO1</button>
      <button class="bo-btn" data-bo="3">BO3</button>
      <button class="bo-btn" data-bo="5">BO5</button>
      <button class="bo-btn" data-bo="7">BO7</button>
      <button class="bo-btn active" data-bo="-1">♾️无限</button>
      <button class="btn btn-ghost" style="padding:6px 14px;font-size:13px;" onclick="backToModeSelect()">← 返回</button>
    </div>

    <div id="gameContainer" class="game-container hidden">
      <div id="targetLabel"  class="target-label hidden">⏱️ 目标时长</div>
      <div id="targetDisplay" class="target-display hidden">--.--s</div>
      <div id="roundInfo"    class="round-info hidden"></div>

      <div id="scoreBoard" class="score-board hidden">
        <div class="score-item">
          <div class="score-name p1-color">玩家1</div>
          <div class="score-value p1-score" id="p1Score">0</div>
        </div>
        <div class="score-divider">:</div>
        <div class="score-item">
          <div class="score-name p2-color">玩家2</div>
          <div class="score-value p2-score" id="p2Score">0</div>
        </div>
      </div>

      <div id="flowTip" class="flow-tip">点击开始按钮进入游戏</div>
      <div id="playersArea" class="players-area hidden"></div>
      <div id="feedbackText" class="feedback-text"></div>
      <div id="progressText" class="progress"></div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;z-index:2;">
        <button id="btnStart" class="btn btn-success" onclick="firstPress()">▶ 开始</button>
        <button id="btnNext"  class="btn btn-warning hidden" onclick="nextRound()">▶ 下一回合</button>
        <button id="btnBack"  class="btn btn-ghost"   onclick="backToModeSelect()">← 返回菜单</button>
      </div>

      <div id="resultContainer" class="result-container hidden"></div>
    </div>

    <div id="ruleTip" class="rule-tip">
      <strong style="color:#ccc;">规则：</strong><br>
      • <strong>操作流程</strong>：点开始展示<strong>目标时间</strong>，按对应键位<strong>开始计时</strong>，再次按键 <strong>掐表</strong><br>
      • <strong>单人模式</strong>：用 <kbd>空格</kbd> 或点击圆点，完成「开始计时 / 掐表」两步<br>
      • <strong>双人Battle</strong>：<strong>玩家1按 F、玩家2按 J</strong>（或各自点自己的圆点），各自独立计时，误差更小者赢<br>
      • <strong>手机/触屏</strong>：直接点圆点即可，采用 pointerdown 触发，无 300ms 点击延迟<br>
      • <strong>评价</strong> ：误差 ≤0.1s <span class="text-skyblue">S+</span> | ≤0.3s <span class="text-orange">S</span> | ≤0.5s <span class="text-purple">A</span> | ≤1s <span class="text-blue">B</span> | ≤2s <span class="text-red">C</span> | ＞2s <span class="text-gray">D</span>
    </div>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalBody"  class="modal-body"></div>
      <button class="btn btn-primary" onclick="closeModal()">了解</button>
    </div>
  </div>

  <script src="../js/second.js"></script>
</body>
</html>
